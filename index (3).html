<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Menghubungkan ke WhatsApp...</title>

    <!-- Auto-redirect ke WhatsApp -->
    <meta http-equiv="refresh" content="0;url=https://wa.me/message/SOHGPEO56DAAK1">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f9fa;
        }
        .loading-container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: calc(90% - 60px);
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #25D366;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        h2 {
            color: #1c1e21;
            font-size: 18px;
            margin: 0 0 10px;
        }
        p {
            color: #606770;
            font-size: 14px;
            margin: 0 0 20px;
        }
        a {
            display: inline-block;
            color: white;
            background-color: #25D366;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #128C7E;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <main class="loading-container">
        <div class="spinner" aria-hidden="true"></div>
        <h2>Menghubungkan ke WhatsApp</h2>
        <p>Sila tunggu sebentar, anda sedang dialihkan secara automatik...</p>
        <a href="https://wa.me/message/SOHGPEO56DAAK1">Klik di sini jika tidak dialihkan</a>
    </main>

    <script>
        window.location.replace("https://wa.me/message/SOHGPEO56DAAK1");
    </script>
</body>
</html>
